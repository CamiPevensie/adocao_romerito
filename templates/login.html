{% extends 'base.html'%}
{% block titulo %} login {% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='padrao.css') }}">{% endblock %}

{% block conteudo %}
    
<div class="container">
    <div class="container4">
        <form action="{{url_for('auth.login')}}" method="post">
        <h1>Faça Login</h1>
        Email: <input type="email" name="email_form">
        Senha: <input type="password" name="senha_form">
        <input type="submit" value="Enviar">
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        </form>
        <div class="img2">
            <img src="../static/img/cachorrinho.png" alt="">
        </div>
    </div>
</div>
{% endblock %}
